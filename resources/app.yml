# Databricks App Resource Configuration
# This file defines the app resources for the Budget Baker Streamlit application

resources:
  apps:
    budget_baker_app:
      # App definition will be inherited from databricks.yml targets
      # Additional app-specific configurations can be added here

      # Source files to include in the app deployment
      source_code_path: ${workspace.file_path}/app

      # App configuration
      config:
        # Environment variables for the app
        env:
          - name: STREAMLIT_SERVER_HEADLESS
            value: "true"
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: "false"
